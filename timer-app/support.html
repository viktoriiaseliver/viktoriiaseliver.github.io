<script>
/* Адрес из App Store Connect и из AppLinks — см. privacy.html рядом,
   там же записано, почему развилка знает все десять папок и почему
   сравнение строгое. Проверяется: python3 ../сторож-развилок.py */
(function () {
  var langs = [
    ["uk", "uk"], ["ru", "ru"], ["en", "en"], ["de", "de"],
    ["es", "es"], ["fr", "fr"], ["it", "it"], ["ja", "ja"],
    ["pt", "pt-br"], ["ar", "ar"]
  ];
  var wanted = navigator.languages || [navigator.language || "en"];
  for (var i = 0; i < wanted.length; i++) {
    var tag = String(wanted[i]).toLowerCase();
    for (var j = 0; j < langs.length; j++) {
      var code = langs[j][0];
      if (tag === code || tag.indexOf(code + "-") === 0) {
        location.replace(langs[j][1] + "/support.html");
        return;
      }
    }
  }
  location.replace("en/support.html");
})();
</script>
