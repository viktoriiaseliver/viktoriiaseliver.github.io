<script>
/* Этот адрес зашит в App Store Connect и в AppLinks (Shared/AppInfo.swift):
   он обязан остаться живым навсегда. Текста здесь нет — только выбор
   языка. Редирект в <head> срабатывает до отрисовки, поэтому страница
   ниже видна лишь тем, у кого выключен JavaScript; для них это не
   заглушка, а работающая развилка из десяти ссылок.

   РАЗВИЛКА ОБЯЗАНА ЗНАТЬ КАЖДУЮ ПАПКУ, КОТОРАЯ ЛЕЖИТ РЯДОМ. До 05.10.2026
   здесь стояли три языка — uk, ru, en, — а переведённых папок было
   десять: немец, японец и арабский читатель открывали английскую
   политику при готовой своей. Страницы внутри папок всё это время
   несли по одиннадцать hreflang и переключатель на десять языков —
   то есть дети знали десять, а родитель три.
   Проверяется за минуту: python3 ../сторож-развилок.py

   СРАВНЕНИЕ СТРОГОЕ: `tag === code` либо `tag` начинается с `code + "-"`.
   Прежнее `indexOf(code) === 0` увело бы `frr` (северофризский)
   во французский, а `arn` (мапудунгун) — в арабский. */
(function () {
  var langs = [
    ["uk", "uk"], ["ru", "ru"], ["en", "en"], ["de", "de"],
    ["es", "es"], ["fr", "fr"], ["it", "it"], ["ja", "ja"],
    /* pt-PT тоже уходит на бразильскую: она единственная, какая есть,
       и португальцу ближе английской. */
    ["pt", "pt-br"], ["ar", "ar"]
  ];
  var wanted = navigator.languages || [navigator.language || "en"];
  for (var i = 0; i < wanted.length; i++) {
    var tag = String(wanted[i]).toLowerCase();
    for (var j = 0; j < langs.length; j++) {
      var code = langs[j][0];
      if (tag === code || tag.indexOf(code + "-") === 0) {
        location.replace(langs[j][1] + "/privacy.html");
        return;
      }
    }
  }
  location.replace("en/privacy.html");
})();
</script>
