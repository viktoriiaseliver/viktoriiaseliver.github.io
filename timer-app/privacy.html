<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policy · Политика приватности — Five More Minutes</title>
<meta name="description" content="Политика приватности Five More Minutes на русском и английском. Privacy policy in English and Russian.">
<link rel="alternate" hreflang="en" href="https://viktoriiaseliver.github.io/timer-app/en/privacy.html">
<link rel="alternate" hreflang="uk" href="https://viktoriiaseliver.github.io/timer-app/uk/privacy.html">
<link rel="alternate" hreflang="ru" href="https://viktoriiaseliver.github.io/timer-app/ru/privacy.html">
<link rel="alternate" hreflang="x-default" href="https://viktoriiaseliver.github.io/timer-app/privacy.html">
<link rel="stylesheet" href="../style.css">
<script>
/* Этот адрес зашит в App Store Connect и в AppLinks (Shared/AppInfo.swift):
   он обязан остаться живым навсегда. Текста здесь нет — только выбор
   языка, en/ или ru/. Редирект в <head> срабатывает до отрисовки, поэтому
   страница ниже видна лишь тем, у кого выключен JavaScript; для них это
   не заглушка, а работающая развилка из двух ссылок. */
(function () {
  var wanted = navigator.languages || [navigator.language || "en"];
  for (var i = 0; i < wanted.length; i++) {
    var tag = String(wanted[i]).toLowerCase();
    if (tag.indexOf("uk") === 0) { location.replace("uk/privacy.html"); return; }
    if (tag.indexOf("ru") === 0) { location.replace("ru/privacy.html"); return; }
    if (tag.indexOf("en") === 0) { location.replace("en/privacy.html"); return; }
  }
  location.replace("en/privacy.html");
})();
</script>
</head>
<body>
<main>
<header>
  <div class="name">Five More Minutes</div>
  <h1>Privacy Policy</h1>
  <p class="updated">Choose a language. Выберите язык.</p>
</header>

<p class="lang"><a href="en/privacy.html">Privacy Policy — in English</a></p>
<p class="lang"><a href="ru/privacy.html">Политика приватности — по-русски</a></p>

<footer>
  <p>viktoriia.seliver@gmail.com</p>
</footer>
</main>
</body>
</html>
