(function () {
  var wanted = navigator.languages || [navigator.language || "en"];
  for (var i = 0; i < wanted.length; i++) {
    var tag = String(wanted[i]).toLowerCase();
    if (tag.indexOf("ru") === 0) { location.replace("ru/support.html"); return; }
    if (tag.indexOf("fr") === 0) { location.replace("fr/support.html"); return; }
    if (tag.indexOf("en") === 0) { location.replace("en/support.html"); return; }
  }
  location.replace("en/support.html");
})();
</script>
