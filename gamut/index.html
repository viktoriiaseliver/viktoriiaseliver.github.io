<html lang="en">
<head>
<meta charset="utf-8">

<title>Gamut</title>

<link rel="alternate" hreflang="fr" href="https://viktoriiaseliver.github.io/gamut/fr/index.html">
<link rel="alternate" hreflang="x-default" href="https://viktoriiaseliver.github.io/gamut/en/index.html">
<link rel="stylesheet" href="../style.css">
<script>
(function () {
  var wanted = navigator.languages || [navigator.language || "en"];
  for (var i = 0; i < wanted.length; i++) {
    var tag = String(wanted[i]).toLowerCase();
    if (tag.indexOf("ru") === 0) { location.replace("ru/index.html"); return; }
    if (tag.indexOf("fr") === 0) { location.replace("fr/index.html"); return; }
    if (tag.indexOf("en") === 0) { location.replace("en/index.html"); return; }
  }
  location.replace("en/index.html");
})();
</script>
</head>
<body>
<main>
<header>
  <div class="name">iPhone</div>
  <h1>Gamut</h1>
  <p class="updated">Choose a language. Choisissez une langue. Выберите язык.</p>
</header>

<footer>
